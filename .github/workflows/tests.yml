name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reads the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      # Pinned to full commit SHAs: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Collectors, bridge and refresh are stdlib-only; the tests run them
      # against throwaway homes with the network calls replaced.
      - name: Usage bridge
        run: python -I tests/test_bridge.py -v

      - name: Collectors
        run: python -I tests/test_collectors.py -v

      - name: Refresh
        run: python -I tests/test_refresh.py -v

      - name: Hardening
        run: python -I tests/test_hardening.py -v

      - name: Panel logic
        run: node tests/test_usage.js
